name = "bytesai-learning"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production custom domain — serves the worker on learn.bytesai.uk
# Cloudflare auto-provisions the DNS record and SSL certificate on deploy
[[routes]]
pattern = "learn.bytesai.uk"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare D1 — source of truth database
[[d1_databases]]
binding = "DB"
database_name = "bytesai-learning-db"
database_id = "5f4ae9d6-2f3f-4370-96f6-c27ef40bc411"
migrations_dir = "db/migrations"

# Cloudflare R2 — user-uploaded assets (avatars, etc.)
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "bytesai-avatars"

# Cloudflare KV — cache and derived state only
[[kv_namespaces]]
binding = "KV"
id = "e8906bbacee64e21a17cdc9822f2c1a7"
preview_id = "e8906bbacee64e21a17cdc9822f2c1a7"

# Cron trigger — fires every hour, handler checks DB settings for actual frequency
# Admin can set: Hourly / 2× Daily / Daily via the Article Generator UI
[triggers]
crons = ["0 * * * *"]

[vars]
NEXT_PUBLIC_SITE_NAME = "BytesAI Learning"
NEXT_PUBLIC_SITE_URL = "https://learn.bytesai.uk"
NODE_ENV = "production"
CHATBOT_MODEL = "google/gemini-3.1-flash-lite-preview"
# Set these as Cloudflare secrets (never in source):
# JWT_SECRET
# OPENROUTER_API_KEY
# FIRECRAWL_API_KEY
# SEED_ADMIN_EMAIL
# SEED_ADMIN_PASSWORD
# SEED_ADMIN_NAME
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# LINKEDIN_CLIENT_ID
# LINKEDIN_CLIENT_SECRET
# TURNSTILE_SITE_KEY
# TURNSTILE_SECRET_KEY
