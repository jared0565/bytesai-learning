<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>

    <!-- Atmospheric glows -->
    <radialGradient id="gAtmBlue" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2a4ccc" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#030a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAtmTeal" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#030a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAtmMid" cx="52%" cy="44%" r="36%">
      <stop offset="0%" stop-color="#1e3799" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#030a1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary accent gradient (blue → teal) for headline text -->
    <linearGradient id="gHeadline" x1="80" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6284f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- URL / center gradient -->
    <linearGradient id="gCenter" x1="350" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6284f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Logo box gradient -->
    <linearGradient id="gLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6284f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Badge background -->
    <linearGradient id="gBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6284f9" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6284f9" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Stat card backgrounds -->
    <linearGradient id="gCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1d47"/>
      <stop offset="100%" stop-color="#07112a"/>
    </linearGradient>

    <!-- Bottom accent bar -->
    <linearGradient id="gBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6284f9"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6284f9"/>
    </linearGradient>

    <!-- Blob blur filter -->
    <filter id="fBlob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <!-- Soft drop shadow for cards -->
    <filter id="fCardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6284f9" flood-opacity="0.12"/>
    </filter>

  </defs>

  <!-- ========== BACKGROUND ========== -->
  <rect width="1200" height="1200" fill="#030a1a"/>
  <rect width="1200" height="1200" fill="url(#gAtmBlue)"/>
  <rect width="1200" height="1200" fill="url(#gAtmTeal)"/>
  <rect width="1200" height="1200" fill="url(#gAtmMid)"/>

  <!-- Soft glow blob behind headline -->
  <ellipse cx="590" cy="455" rx="480" ry="310" fill="#1a3a8f" opacity="0.09" filter="url(#fBlob)"/>
  <!-- Secondary teal blob bottom-right -->
  <ellipse cx="980" cy="920" rx="320" ry="220" fill="#0e7490" opacity="0.07" filter="url(#fBlob)"/>

  <!-- ========== GRID LINES (very subtle) ========== -->
  <g opacity="0.035" stroke="#8aa4ff" stroke-width="0.75" fill="none">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="0" y1="1000" x2="1200" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1200"/>
    <line x1="400" y1="0" x2="400" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="800" y1="0" x2="800" y2="1200"/>
    <line x1="1000" y1="0" x2="1000" y2="1200"/>
  </g>

  <!-- ========== STARS ========== -->
  <g fill="#dceeff">
    <!-- Top band -->
    <circle cx="47" cy="134" r="1.4" opacity="0.55"/>
    <circle cx="98" cy="67" r="0.9" opacity="0.38"/>
    <circle cx="156" cy="189" r="1.1" opacity="0.58"/>
    <circle cx="213" cy="45" r="0.7" opacity="0.32"/>
    <circle cx="289" cy="112" r="1.8" opacity="0.62"/>
    <circle cx="334" cy="78" r="0.8" opacity="0.42"/>
    <circle cx="401" cy="156" r="1.2" opacity="0.52"/>
    <circle cx="467" cy="34" r="1.0" opacity="0.48"/>
    <circle cx="523" cy="167" r="0.7" opacity="0.38"/>
    <circle cx="589" cy="89" r="1.5" opacity="0.58"/>
    <circle cx="645" cy="45" r="0.9" opacity="0.42"/>
    <circle cx="712" cy="134" r="1.1" opacity="0.52"/>
    <circle cx="756" cy="23" r="1.6" opacity="0.65"/>
    <circle cx="823" cy="89" r="0.8" opacity="0.38"/>
    <circle cx="878" cy="156" r="1.3" opacity="0.58"/>
    <circle cx="934" cy="67" r="0.7" opacity="0.32"/>
    <circle cx="989" cy="112" r="1.7" opacity="0.62"/>
    <circle cx="1045" cy="45" r="1.0" opacity="0.48"/>
    <circle cx="1112" cy="178" r="0.8" opacity="0.42"/>
    <circle cx="1167" cy="89" r="1.2" opacity="0.52"/>
    <!-- Near logo / upper middle -->
    <circle cx="34" cy="267" r="1.0" opacity="0.42"/>
    <circle cx="123" cy="334" r="0.8" opacity="0.38"/>
    <circle cx="1067" cy="289" r="1.1" opacity="0.48"/>
    <circle cx="1145" cy="356" r="0.7" opacity="0.32"/>
    <!-- Left edge (flanking content) -->
    <circle cx="23" cy="423" r="1.3" opacity="0.52"/>
    <circle cx="56" cy="534" r="0.9" opacity="0.38"/>
    <circle cx="34" cy="645" r="1.1" opacity="0.48"/>
    <circle cx="67" cy="756" r="0.7" opacity="0.32"/>
    <circle cx="45" cy="867" r="1.4" opacity="0.58"/>
    <!-- Right edge -->
    <circle cx="1145" cy="434" r="1.0" opacity="0.42"/>
    <circle cx="1167" cy="545" r="0.8" opacity="0.38"/>
    <circle cx="1156" cy="656" r="1.2" opacity="0.52"/>
    <circle cx="1134" cy="767" r="0.7" opacity="0.32"/>
    <circle cx="1178" cy="878" r="1.5" opacity="0.62"/>
    <!-- Bottom band -->
    <circle cx="89" cy="1034" r="1.2" opacity="0.52"/>
    <circle cx="178" cy="1089" r="0.9" opacity="0.42"/>
    <circle cx="267" cy="1045" r="1.1" opacity="0.48"/>
    <circle cx="389" cy="1112" r="0.7" opacity="0.32"/>
    <circle cx="456" cy="1056" r="1.4" opacity="0.58"/>
    <circle cx="578" cy="1089" r="0.8" opacity="0.38"/>
    <circle cx="667" cy="1034" r="1.0" opacity="0.48"/>
    <circle cx="756" cy="1112" r="1.3" opacity="0.52"/>
    <circle cx="867" cy="1056" r="0.7" opacity="0.32"/>
    <circle cx="945" cy="1089" r="1.5" opacity="0.62"/>
    <circle cx="1045" cy="1034" r="0.9" opacity="0.42"/>
    <circle cx="1134" cy="1112" r="1.1" opacity="0.48"/>
    <circle cx="1178" cy="1056" r="0.8" opacity="0.38"/>
    <!-- Occasional bright large stars -->
    <circle cx="289" cy="112" r="3.0" opacity="0.18"/>
    <circle cx="989" cy="112" r="2.8" opacity="0.18"/>
    <circle cx="1178" cy="878" r="2.6" opacity="0.18"/>
    <circle cx="45" cy="867" r="2.4" opacity="0.18"/>
  </g>

  <!-- ========== BORDER ACCENTS ========== -->
  <!-- Top line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#gBar)" opacity="0.22"/>
  <!-- Left/right thin lines -->
  <rect x="0" y="0" width="2.5" height="1200" fill="url(#gBar)" opacity="0.20"/>
  <rect x="1197.5" y="0" width="2.5" height="1200" fill="url(#gBar)" opacity="0.20"/>

  <!-- ========== LOGO ROW ========== -->
  <!-- Icon box with gradient -->
  <rect x="80" y="80" width="58" height="58" rx="15" fill="url(#gLogo)"/>
  <!-- BookOpen icon (Lucide paths, 24×24 viewBox, scaled 1.55× and offset into box) -->
  <g transform="translate(80,80) translate(11,11) scale(1.5)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </g>
  <!-- Wordmark -->
  <text x="154" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="35" font-weight="700" fill="#f0f4ff" letter-spacing="-0.6">BytesAI<tspan fill="#7c9bff"> Learning</tspan></text>

  <!-- Horizontal rule below logo -->
  <line x1="80" y1="162" x2="1120" y2="162" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ========== TRUST BADGE PILL ========== -->
  <rect x="262" y="190" width="676" height="54" rx="27" fill="url(#gBadge)" stroke="#6284f9" stroke-opacity="0.32" stroke-width="1"/>
  <text x="600" y="224" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="500" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.2">&#9733;  100+ Free AI Courses  ·  Verified  ·  No Paywalls</text>

  <!-- ========== MAIN HEADLINE ========== -->
  <!-- Line 1 -->
  <text x="80" y="338" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="91" font-weight="800" fill="#f0f4ff" letter-spacing="-3.5">The best free</text>
  <!-- Line 2 -->
  <text x="80" y="444" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="91" font-weight="800" fill="#f0f4ff" letter-spacing="-3.5">AI courses,</text>
  <!-- Line 3 — gradient accent -->
  <text x="80" y="550" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="91" font-weight="800" fill="url(#gHeadline)" letter-spacing="-3.5">curated for you.</text>

  <!-- ========== SUBTITLE ========== -->
  <text x="80" y="607" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="-0.4">Stop hunting across 20 tabs. Free AI learning from Google, Microsoft,</text>
  <text x="80" y="645" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="-0.4">Anthropic and NVIDIA — curated, verified, no paywalls.</text>

  <!-- Divider -->
  <line x1="80" y1="683" x2="1120" y2="683" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ========== PROVIDERS STRIP ========== -->
  <text x="600" y="726" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="2.5">COURSES FROM</text>
  <text x="600" y="772" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="-0.2">Google  ·  Microsoft  ·  Anthropic  ·  NVIDIA  ·  DeepLearning.AI</text>

  <!-- ========== STAT CARDS ========== -->
  <!-- Card 1 — Free Courses -->
  <rect x="80" y="820" width="316" height="138" rx="20" fill="url(#gCard)" stroke="#6284f9" stroke-opacity="0.25" stroke-width="1" filter="url(#fCardShadow)"/>
  <!-- Top accent line on card -->
  <rect x="80" y="820" width="316" height="3" rx="20" fill="url(#gBar)" opacity="0.55"/>
  <text x="238" y="886" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="50" font-weight="800" fill="url(#gHeadline)" text-anchor="middle">100+</text>
  <text x="238" y="932" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">Free Courses</text>

  <!-- Card 2 — Providers -->
  <rect x="442" y="820" width="316" height="138" rx="20" fill="url(#gCard)" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" filter="url(#fCardShadow)"/>
  <rect x="442" y="820" width="316" height="3" rx="20" fill="url(#gBar)" opacity="0.55"/>
  <text x="600" y="886" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="50" font-weight="800" fill="url(#gHeadline)" text-anchor="middle">28</text>
  <text x="600" y="932" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">Trusted Providers</text>

  <!-- Card 3 — Cost -->
  <rect x="804" y="820" width="316" height="138" rx="20" fill="url(#gCard)" stroke="#6284f9" stroke-opacity="0.25" stroke-width="1" filter="url(#fCardShadow)"/>
  <rect x="804" y="820" width="316" height="3" rx="20" fill="url(#gBar)" opacity="0.55"/>
  <text x="962" y="886" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="50" font-weight="800" fill="url(#gHeadline)" text-anchor="middle">$0</text>
  <text x="962" y="932" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">Cost to Start</text>

  <!-- ========== URL / CTA AREA ========== -->
  <text x="600" y="1035" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="31" font-weight="600" fill="url(#gCenter)" text-anchor="middle" letter-spacing="-0.4">learn.bytesai.uk</text>
  <!-- Underline -->
  <line x1="400" y1="1044" x2="800" y2="1044" stroke="url(#gCenter)" stroke-width="1.5" opacity="0.45"/>

  <text x="600" y="1092" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">Start learning today — no credit card, no paywalls, just courses.</text>

  <!-- ========== BOTTOM GRADIENT BAR ========== -->
  <rect x="0" y="1157" width="1200" height="6" fill="url(#gBar)" opacity="0.80"/>

</svg>
