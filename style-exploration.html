const styles = [null, s1, s2, s3];
const labels = [null, '01 — Editorial Precision', '02 — Compass Warm', '03 — Signal Clear'];

function initPreviews() {
  [1, 2, 3].forEach(n => {
    const frame = document.getElementById('f' + n);
    const wrapper = frame.parentElement;
    const w = wrapper.clientWidth;
    const scale = w / 1440;
    frame.style.cssText = [
      'position:absolute', 'top:0', 'left:0',
      'width:1440px', 'height:1800px', 'border:none',
      'transform-origin:top left',
      `transform:scale(${scale})`
    ].join(';');
    frame.srcdoc = styles[n];
  });
}

function expand(n) {
  document.getElementById('full-frame').srcdoc = styles[n];
  document.getElementById('style-badge').textContent = labels[n];
  document.getElementById('full-overlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function collapse() {
  document.getElementById('full-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

window.addEventListener('load', initPreviews);
window.addEventListener('resize', initPreviews);
document.addEventListener('keydown', e => { if (e.key === 'Escape') collapse(); });
